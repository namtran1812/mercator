services:
  - type: web
    name: mercator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/start-production.sh
    healthCheckPath: /health
    envVars:
      - key: MERCATOR_DEMO_MODE
        value: "true"

      - key: POSTGRES_DSN
        sync: false
